[project]
name = "gridcast"
version = "0.1.0"
description = "Probabilistic day-ahead price forecasting and battery dispatch for Ontario's renewed electricity market."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary (licence to be chosen before publication)" }
dependencies = [
    "arch>=7.0",
    "duckdb>=1.1",
    "gridstatusio>=0.10",
    "holidays>=0.58",
    "httpx>=0.27",
    "lightgbm>=4.5",
    "lxml>=5.3",
    "optuna>=4.0",
    "pandas>=2.2",
    "pandera>=0.20",
    "pyarrow>=17",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pytz>=2024.1",
    "pyyaml>=6.0",
    "ruptures>=1.1",
    "scikit-learn>=1.5",
    "scipy>=1.14",
    "statsmodels>=0.14",
    "structlog>=24.1",
]

[project.scripts]
gridcast = "gridcast.cli:main"

[dependency-groups]
dev = [
    "hypothesis>=6.112",
    "lxml-stubs>=0.5",
    "mypy>=1.11",
    "pandas-stubs>=2.2",
    "pre-commit>=3.8",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pytest-socket>=0.7",
    "respx>=0.21",
    "ruff>=0.6",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "UP",       # pyupgrade
    "B",        # bugbear
    "SIM",      # simplify
    "N",        # pep8-naming
    "PT",       # pytest style
    "DTZ",      # naive datetimes are bugs in this project (see §7.3 of the plan)
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["DTZ001"]  # tests may build naive datetimes on purpose to check rejection

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*", "scipy", "scipy.*", "sklearn", "sklearn.*", "statsmodels.*", "ruptures", "arch", "arch.*"]   # no type information
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--disable-socket",       # no network in tests, ever (plan §12)
    "--allow-unix-socket",
    "--cov=gridcast",
    "--cov-report=term-missing",
    "--cov-fail-under=80",
]
markers = [
    "leakage: point-in-time / look-ahead leakage tests (plan §7.5)",
]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["gridcast"]
